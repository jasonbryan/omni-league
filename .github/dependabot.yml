version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Every window must equal .npmrc min-release-age.
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 3
    ignore:
      # Angular 22 supports TypeScript >=6.0 <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @convex-dev/better-auth 0.13 needs peer better-auth <1.8.0, so 1.8 waits for a component that accepts it.
      - dependency-name: better-auth
        versions: ['>=1.8.0']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        # A grouped PR would hide a version change of a one-maintainer package that runs with every deployment secret.
        exclude-patterns: ['@block65/webcrypto-web-push']
    labels: [type:chore, area:infra]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [type:chore, area:infra]
    commit-message:
      prefix: ci
      include: scope
