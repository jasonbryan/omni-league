name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, production]
  push:
    branches: [main]
    paths: [package-lock.json, .github/workflows/ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  ci:
    name: ci
    # Drafts and the cache-warming push get a skipped job: 0 billed minutes.
    if: ${{ github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # --no-renames lists both paths of a rename, so moving an app file into docs/ is an app change.
      # pipefail: a failed git diff fails the pipeline, so the warning branch runs.
      - name: scope
        id: scope
        run: |
          set -o pipefail
          if outputs="$(git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci-scope.mjs)" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$outputs"
          else
            echo "::warning::scope detection failed; running every check"
            printf 'scope=app\napp=true\nchecks=true\ntypecheck=true\n' >> "$GITHUB_OUTPUT"
          fi
      # Every npm Dependabot cooldown window must equal .npmrc min-release-age.
      - name: release age
        shell: sh
        run: |
          status=0
          if [ ! -f .npmrc ]; then
            echo "::error file=.npmrc::.npmrc not found"
            exit 1
          fi
          count="$(grep -cE '^[[:space:]]*min-release-age[[:space:]]*=' .npmrc || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=.npmrc::expected exactly one min-release-age line, found ${count}"
            exit 1
          fi
          age="$(sed -nE 's/^[[:space:]]*min-release-age[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' .npmrc)"
          if [ -z "$age" ]; then
            echo "::error file=.npmrc::min-release-age is not a whole number of days"
            exit 1
          fi
          # The header value may be quoted, carry a trailing comment, or end in CR.
          npm_block="$(awk '/^[[:space:]]*-[[:space:]]*package-ecosystem:/ { v = $0; sub(/^[^:]*:/, "", v); sub(/#.*/, "", v); gsub(/[^A-Za-z0-9_-]/, "", v); in_npm = (v == "npm") } in_npm' .github/dependabot.yml)"
          if [ -z "$npm_block" ]; then
            echo "::error file=.github/dependabot.yml::no package-ecosystem: npm entry found"
            exit 1
          fi
          for key in default-days semver-patch-days semver-minor-days semver-major-days; do
            n="$(printf '%s\n' "$npm_block" | grep -cE "^[[:space:]]*${key}:" || true)"
            value="$(printf '%s\n' "$npm_block" | sed -nE "s/^[[:space:]]*${key}:[[:space:]]*([0-9]+)[[:space:]]*(#.*)?$/\1/p")"
            if [ "$n" -ne 1 ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key}: expected exactly one, found ${n}"
              status=1
            elif [ "$value" != "$age" ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key} is '${value}', .npmrc min-release-age is ${age}"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "Every npm cooldown window equals min-release-age=${age}."
          fi
          exit "$status"
      # !cancelled() lets setup-node and install run after a release age failure.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        if: ${{ !cancelled() }}
        with:
          node-version-file: package.json
      - name: install
        id: install
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm ci
      # Every check below runs even when an earlier one failed, so one run reports them all.
      - name: format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: audit signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm audit signatures
      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run lint
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.typecheck == 'true' }}
        run: npm run typecheck
      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm test
      - name: test:convex
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run test:convex
      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run build
      # Checksum-verified binary instead of an action; version and hash are bumped by hand.
      - name: actionlint
        if: ${{ !cancelled() && steps.scope.outputs.checks == 'true' }}
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      # build-icons.test.mjs re-renders the icons in Chromium, and skips that check without it.
      - name: chromium
        if: ${{ success() && steps.scope.outputs.app == 'true' }}
        run: npx playwright install --with-deps --only-shell chromium
      # !cancelled(), not success(): it still reports its own failures when an earlier check failed.
      - name: test:scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run test:scripts

  warm-cache:
    name: warm-cache
    # Runs on main only when the lockfile or this workflow changes, so that PR
    # runs restore main's npm cache (a PR run cannot restore another PR's cache).
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: install (fills the npm cache that setup-node saves)
        run: npm ci --ignore-scripts
