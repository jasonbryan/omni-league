name: Feature slice
description: One user-visible behaviour, end to end, sized for one PR.
labels: ['type:feature', 'status:planning']
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable Given/When/Then statements. Each one must be provable by a test or a screenshot.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Unit, Convex, and e2e tests that prove each criterion, including permission and empty-data cases.
    validations:
      required: true
  - type: textarea
    id: demo
    attributes:
      label: Demo data
      description: 'The rows `seed:demo` adds, or the demo account that shows the feature, or `Demo data: none` with the reason.'
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Gates
      description: Gates this issue needs before implementation. Give reasons in the notes below.
      options:
        - label: 'gate:technology (new package, service, or tool)'
        - label: 'gate:production (production deploy or Stripe live-mode change)'
  - type: textarea
    id: notes
    attributes:
      label: Notes, gate reasons, dependencies
      description: 'Use one `Blocked by: #n` line per dependency.'
