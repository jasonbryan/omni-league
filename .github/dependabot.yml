version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Every window must equal .npmrc min-release-age.
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 3
    ignore:
      # Angular 22 supports TypeScript >=6.0 <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [type:chore, area:infra]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [type:chore, area:infra]
    commit-message:
      prefix: ci
      include: scope
