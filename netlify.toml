# SSR runs as the edge function the plugin generates from src/server.ts (netlifyAppEngineHandler).

[build]
  publish = "dist/omni-league/browser"

# The deploy environment check runs after `npx convex deploy`, because pr-<number> does not exist
# before it. `seed:demo` inserts any missing demo data on every build, never on a deployment that
# failed the check. Not `--preview-run`: it runs only when the deploy creates a new deployment.
[context.deploy-preview]
  command = "npm ci && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL --preview-create \"pr-$REVIEW_ID\" && node scripts/check-deploy-env.mjs preview --preview-name \"pr-$REVIEW_ID\" && npx convex run seed:demo --preview-name \"pr-$REVIEW_ID\""

# `--preview-name`, not `--preview-create`: it reuses the deployment named main (and creates it when
# none exists), so staging keeps its data between deploys. `--preview-create` deletes and recreates
# the deployment on every deploy. PR previews keep `--preview-create`: a fresh backend per push is
# wanted there.
[context.branch-deploy]
  command = "npm ci && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL --preview-name \"$HEAD\" && node scripts/check-deploy-env.mjs preview --preview-name \"$HEAD\" && npx convex run seed:demo --preview-name \"$HEAD\""

# Production runs no function and no seed, so it has no demo data.
[context.production]
  command = "npm ci && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL"

[[plugins]]
  package = "@netlify/angular-runtime"

# Long-lived browser caching only for content-hashed build outputs. Nothing in public/ may use
# these names. Every other file keeps Netlify's default `public, max-age=0, must-revalidate`.
#
# The web app manifest is a plain file in public/, so a changed name or icon reaches users on the
# next load. Only its content type is set, so every deploy answers with the manifest media type, not
# a guessed one.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunk-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/polyfills-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
