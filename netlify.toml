[build]
  publish = "dist/omni-league/browser"

# The deploy environment check runs after `npx convex deploy`, because pr-<number> does not exist
# before it. `seed:demo` inserts any missing demo data on every build, never on a deployment that
# failed the check. Not `--preview-run`: it runs only when the deploy creates a new deployment.
[context.deploy-preview]
  command = "npm ci && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL --preview-create \"pr-$REVIEW_ID\" && node scripts/check-deploy-env.mjs preview --preview-name \"pr-$REVIEW_ID\" && npx convex run seed:demo --preview-name \"pr-$REVIEW_ID\""

# Staging alternates between two Convex deployments, staging-a and staging-b. `--preview-create`
# deletes and recreates the one the published site is not using (`scripts/staging-slot.mjs` reads
# its `/staging-slot.txt`), so the live frontend keeps a live backend until Netlify publishes the
# new one. The script is its own step so a crash fails the build, which `export X=$(...)` would hide.
[context.branch-deploy]
  command = "npm ci && STAGING_SLOT=\"$(node scripts/staging-slot.mjs)\" && export STAGING_SLOT && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL --preview-create \"$STAGING_SLOT\" && node scripts/check-deploy-env.mjs preview --preview-name \"$STAGING_SLOT\" && npx convex run seed:demo --preview-name \"$STAGING_SLOT\""

[context.production]
  command = "npm ci && npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name CONVEX_URL"

[[plugins]]
  package = "@netlify/angular-runtime"

# The web app manifest is a plain file in public/, so a changed name or icon reaches users on the
# next load. Only its content type is set, so every deploy answers with the manifest media type, not
# a guessed one.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Nothing in public/ may use these hashed-output names.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunk-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/polyfills-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
