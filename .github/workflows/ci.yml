name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main, production]
  push:
    branches: [main]
    paths: [package-lock.json, .github/workflows/ci.yml]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      webkit:
        description: Also run the webkit-mobile e2e project
        type: boolean
        default: false

permissions:
  contents: read

# A label outside the trigger set gets its own group, so it never cancels a run in progress.
concurrency:
  group: ${{ github.event_name != 'pull_request' && format('ci-{0}', github.run_id) || (github.event.action == 'labeled' && github.event.label.name != 'ready-to-merge' && github.event.label.name != 'gate:technology' && github.event.label.name != 'gate:production') && format('run-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # Any failure to look the run up leaves `skip` empty, and the full suite runs.
  nightly-gate:
    name: nightly-gate
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.last-tested.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      # A startup failure, a cancelled run (even one whose jobs read as a gate skip), or a run with no `ci` or `checks` job tested nothing.
      - name: last tested night
        id: last-tested
        run: |
          last=''
          runs="$(gh run list --workflow ci.yml --event schedule --branch main --status completed --limit 10 --json databaseId,headSha,conclusion --jq '.[] | select(.conclusion != "cancelled") | "\(.databaseId) \(.headSha)"')" || runs=''
          while read -r id sha; do
            [ -n "$id" ] || continue
            state="$(gh run view "$id" --json jobs --jq '(.jobs | map({(.name): .conclusion}) | add // {}) as $j | if ($j.ci == "success" or $j.ci == "failure") or (($j.ci == "skipped" or $j.checks == "skipped") and $j["nightly-gate"] == "success") then "tested" else "untested" end')" || break
            if [ "$state" = tested ]; then
              last="$sha"
              break
            fi
          done <<< "$runs"
          if [ -n "$last" ] && [ "$last" = "$HEAD_SHA" ]; then
            echo "::notice::main is still ${HEAD_SHA:0:7}, the commit the last tested nightly run covered; skipping tonight's run"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

  # A skipped job counts as a pass for the required check, so none is named `ci`, a gated nightly
  # included: the tip of main is also the head of a release PR.
  # FULL_RUN repeats the name condition because a job name cannot read `env`.
  checks:
    name: ${{ ((github.event_name == 'schedule' && needs.nightly-gate.outputs.skip != 'true') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'ready-to-merge' || github.event.label.name == 'gate:technology' || github.event.label.name == 'gate:production')) || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'gate:technology') || contains(github.event.pull_request.labels.*.name, 'gate:production') || github.base_ref == 'production'))))) && 'ci' || 'checks' }}
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'ready-to-merge' || github.event.label.name == 'gate:technology' || github.event.label.name == 'gate:production')) || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'gate:technology') || contains(github.event.pull_request.labels.*.name, 'gate:production') || github.base_ref == 'production' || !github.event.pull_request.draft))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      e2e_failures: ${{ steps.failures.outputs.failures }}
    env:
      E2E_WEBKIT: ${{ (github.base_ref == 'production' || inputs.webkit == true) && '1' || '0' }}
      FULL_RUN: ${{ ((github.event_name == 'schedule' && needs.nightly-gate.outputs.skip != 'true') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && (github.event.label.name == 'ready-to-merge' || github.event.label.name == 'gate:technology' || github.event.label.name == 'gate:production')) || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'gate:technology') || contains(github.event.pull_request.labels.*.name, 'gate:production') || github.base_ref == 'production'))))) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # GitHub recomputes refs/pull/<n>/merge after update-branch, so a run can check out the old merge
      # of a head that has since moved.
      - name: merge ref
        id: merge-ref
        if: ${{ github.event_name == 'pull_request' && env.FULL_RUN == '1' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          second_parent="$(git rev-parse --verify --quiet 'HEAD^2' || true)"
          if [ -z "$PR_HEAD_SHA" ] || [ "$second_parent" != "$PR_HEAD_SHA" ]; then
            echo "::error::stale merge ref: the merge commit's second parent is not the PR head ${PR_HEAD_SHA:0:7}; remove ready-to-merge and add it again"
            exit 1
          fi
      # --no-renames lists both paths of a rename, so moving an app file into docs/ is an app change.
      # pipefail: a failed git diff fails the pipeline, so the warning branch runs.
      - name: scope
        id: scope
        run: |
          set -o pipefail
          if outputs="$(git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci-scope.mjs)" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$outputs"
          else
            echo "::warning::scope detection failed; running every check"
            printf 'scope=app\napp=true\nchecks=true\ntypecheck=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: e2e specs
        id: specs
        if: ${{ steps.scope.outputs.app == 'true' && env.FULL_RUN == '1' }}
        run: |
          set -o pipefail
          if outputs="$(git diff --no-renames --name-only HEAD^1 HEAD | node scripts/e2e-affected.mjs)" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$outputs"
          else
            echo "::warning::e2e spec selection failed; running the full suite"
            printf 'e2e_scope=full\ne2e_specs=\n' >> "$GITHUB_OUTPUT"
          fi
      # Every npm Dependabot cooldown window must equal .npmrc min-release-age.
      - name: release age
        shell: sh
        run: |
          status=0
          if [ ! -f .npmrc ]; then
            echo "::error file=.npmrc::.npmrc not found"
            exit 1
          fi
          count="$(grep -cE '^[[:space:]]*min-release-age[[:space:]]*=' .npmrc || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=.npmrc::expected exactly one min-release-age line, found ${count}"
            exit 1
          fi
          age="$(sed -nE 's/^[[:space:]]*min-release-age[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' .npmrc)"
          if [ -z "$age" ]; then
            echo "::error file=.npmrc::min-release-age is not a whole number of days"
            exit 1
          fi
          # The header value may be quoted, carry a trailing comment, or end in CR.
          npm_block="$(awk '/^[[:space:]]*-[[:space:]]*package-ecosystem:/ { v = $0; sub(/^[^:]*:/, "", v); sub(/#.*/, "", v); gsub(/[^A-Za-z0-9_-]/, "", v); in_npm = (v == "npm") } in_npm' .github/dependabot.yml)"
          if [ -z "$npm_block" ]; then
            echo "::error file=.github/dependabot.yml::no package-ecosystem: npm entry found"
            exit 1
          fi
          for key in default-days semver-patch-days semver-minor-days semver-major-days; do
            n="$(printf '%s\n' "$npm_block" | grep -cE "^[[:space:]]*${key}:" || true)"
            value="$(printf '%s\n' "$npm_block" | sed -nE "s/^[[:space:]]*${key}:[[:space:]]*([0-9]+)[[:space:]]*(#.*)?$/\1/p")"
            if [ "$n" -ne 1 ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key}: expected exactly one, found ${n}"
              status=1
            elif [ "$value" != "$age" ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key} is '${value}', .npmrc min-release-age is ${age}"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "Every npm cooldown window equals min-release-age=${age}."
          fi
          exit "$status"
      # !cancelled() lets setup-node and install run after a release age failure.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup-node
        if: ${{ !cancelled() && steps.merge-ref.outcome != 'failure' }}
        with:
          node-version-file: package.json
      - name: install
        id: install
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm ci
      # Every check below runs even when an earlier one failed, so one run reports them all.
      - name: format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: audit signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm audit signatures
      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run lint
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.typecheck == 'true' }}
        run: npm run typecheck
      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm test
      - name: test:convex
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run test:convex
      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run build
      # Checksum-verified binary instead of an action; version and hash are bumped by hand.
      - name: actionlint
        if: ${{ !cancelled() && steps.scope.outputs.checks == 'true' }}
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      # Headless shell only: the Playwright config sets no channel.
      - name: e2e browsers
        if: ${{ success() && steps.scope.outputs.app == 'true' && env.FULL_RUN == '1' }}
        run: |
          npx playwright install --with-deps --only-shell chromium
          if [ "$E2E_WEBKIT" = "1" ]; then
            npx playwright install --with-deps webkit
          fi
      # After e2e browsers so build-icons.test.mjs re-renders the icons in Chromium instead of skipping;
      # a fast run installs no browsers, so that test skips there.
      # !cancelled(), not success(): it still reports its own failures when an earlier check failed.
      - name: test:scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run test:scripts
      - name: e2e backend
        id: e2e-backend
        if: ${{ success() && steps.scope.outputs.app == 'true' }}
        run: node scripts/e2e-convex.mjs push
      - name: convex codegen drift
        if: ${{ !cancelled() && steps.e2e-backend.outcome == 'success' }}
        run: |
          drift=0
          git diff --exit-code convex/_generated || drift=1
          untracked="$(git status --porcelain --untracked-files=all -- convex/_generated)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::codegen wrote files that are not committed under convex/_generated"
            drift=1
          fi
          exit "$drift"
      # Runs after a drift failure too, so one run reports both.
      - name: e2e
        id: e2e
        if: ${{ !cancelled() && steps.e2e-backend.outcome == 'success' && env.FULL_RUN == '1' }}
        env:
          E2E_SCOPE: ${{ steps.specs.outputs.e2e_scope }}
          E2E_SPECS: ${{ steps.specs.outputs.e2e_specs }}
        run: |
          specs=()
          if [ "$E2E_SCOPE" = "affected" ]; then
            read -r -a specs <<< "$E2E_SPECS"
          fi
          echo "e2e: ${#specs[@]} spec filter(s); none means every spec"
          npm run e2e -- "${specs[@]}"
      - name: e2e failures
        id: failures
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.e2e.outcome == 'failure' }}
        run: node scripts/e2e-failures.mjs >> "$GITHUB_OUTPUT"
      - name: e2e report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # issues: write for this job only; no checkout, no other secret.
  nightly-issue:
    name: nightly-issue
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILURES: ${{ needs.checks.outputs.e2e_failures }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT: ${{ github.sha }}
      ISSUE_TITLE: Nightly e2e failed on main
    steps:
      - name: open or update the issue
        run: |
          failures="$(printf '%s' "${FAILURES:-[]}" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)" || failures='[]'
          [ -n "$failures" ] || failures='[]'
          body="$(jq -rn --arg run "$RUN_URL" --arg commit "${COMMIT:0:7}" --argjson failures "$failures" '
            "Nightly e2e: FAIL (main \($commit))\n\nRun: \($run)\n\n"
            + (if ($failures | length) > 0
               then "Failing tests:\n" + ($failures | map("- `" + gsub("`"; "\u0027") + "`") | join("\n"))
               else "No failing test was recorded: a step before or after the e2e step failed. See the run." end)')"
          number="$(gh issue list --state open --label type:bug --limit 100 --json number,title \
            | jq -r --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label type:bug --label status:ready --body "$body"
          fi

  warm-cache:
    name: warm-cache
    # Runs on main only when the lockfile or this workflow changes, so that PR
    # runs restore main's npm cache (a PR run cannot restore another PR's cache).
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: install (fills the npm cache that setup-node saves)
        run: npm ci --ignore-scripts
