# Dependabot version updates (ADR 0009 "Dependabot configuration"). Security updates are
# turned on in the repository settings and do not wait for this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Every window must equal .npmrc min-release-age (ADR 0003, ADR 0009 amendment, #47).
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 3
    ignore:
      # Angular 22 supports TypeScript >=6.0 <6.1. Remove with the Angular major that supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [type:chore, area:infra]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    labels: [type:chore, area:infra]
    commit-message:
      prefix: ci
      include: scope
