# CI pipeline (ADR 0009). One required check, `ci`, run once per mergeable tree:
# ready PRs only; drafts get a skipped job (0 billed minutes); nothing re-runs on main except the
# nightly full run (ADR 0009, "Amendment: affected e2e specs on PRs, full suite nightly", #186).
# Required check, merge procedure, and minutes: docs/process/ci.md.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, production]
  push:
    branches: [main]
    paths: [package-lock.json, .github/workflows/ci.yml]
  # The nightly full run on main (#186). Schedules run on the default branch only, never on a PR
  # branch. Every step of `ci` runs, with the whole e2e suite (both Chromium projects); a failure
  # opens or updates one `type:bug` issue (job `nightly-issue`).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      webkit:
        description: Also run the webkit-mobile e2e project
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  ci:
    name: ci
    # Draft PRs and the cache-warming push get a skipped job: 0 billed minutes.
    if: ${{ github.event_name != 'push' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      e2e_failures: ${{ steps.failures.outputs.failures }}
    env:
      # 1 on release PRs into production and on workflow_dispatch with webkit: true (ADR 0009);
      # the Playwright config adds the webkit-mobile project only then.
      E2E_WEBKIT: ${{ (github.base_ref == 'production' || inputs.webkit == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # What the PR changes decides how much of the job runs (#165, scripts/ci-scope.mjs, docs/process/ci.md):
      # docs        only docs/, design/, .claude/, root *.md: release age, install, format:check;
      # tooling     also .github/ and scripts/ that the build, e2e and deploy do not run (derived by ci-scope.mjs from
      #             package.json, netlify.toml, angular.json, playwright.config.ts, e2e/): adds lint, test:scripts,
      #             actionlint (typecheck when a .ts file changed);
      # app         anything else, ci.yml and ci-scope.mjs themselves, docs that test:convex reads, workflow_dispatch,
      #             and release PRs into production: every step.
      # HEAD is the PR merge commit; its first parent is the base branch. --no-renames lists both paths of a
      # rename, so moving an app file into docs/ is an app change. Any failure to detect runs every check, and
      # the job still concludes success when the checks that did run pass, so the required check `ci` reports.
      # Runs on the Node the runner image ships, before setup-node, so the script uses built-ins only.
      # pipefail: a failed git diff fails the pipeline, so the warning branch runs.
      - name: scope
        id: scope
        run: |
          set -o pipefail
          if outputs="$(git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci-scope.mjs)" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$outputs"
          else
            echo "::warning::scope detection failed; running every check"
            printf 'scope=app\napp=true\nchecks=true\ntypecheck=true\n' >> "$GITHUB_OUTPUT"
          fi
      # Which e2e specs run (#186, scripts/e2e-affected.mjs, docs/process/ci.md): on a PR into main, the
      # specs the changed files map to plus the smoke and harness specs; the full suite for shared or
      # unmapped files, release PRs, workflow_dispatch, and the nightly schedule. Any failure to detect
      # runs the full suite: the e2e step narrows the run only when this step says `affected`.
      # Same diff and same runner Node as `scope`, built-ins only.
      - name: e2e specs
        id: specs
        if: ${{ steps.scope.outputs.app == 'true' }}
        run: |
          set -o pipefail
          if outputs="$(git diff --no-renames --name-only HEAD^1 HEAD | node scripts/e2e-affected.mjs)" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$outputs"
          else
            echo "::warning::e2e spec selection failed; running the full suite"
            printf 'e2e_scope=full\ne2e_specs=\n' >> "$GITHUB_OUTPUT"
          fi
      # Every npm Dependabot cooldown window must equal .npmrc min-release-age (ADR 0003, ADR 0009 amendment, #47).
      # Reads only the package-ecosystem: npm block. POSIX sh, grep, awk, sed; needs no install.
      - name: release age
        shell: sh
        run: |
          status=0
          if [ ! -f .npmrc ]; then
            echo "::error file=.npmrc::.npmrc not found"
            exit 1
          fi
          count="$(grep -cE '^[[:space:]]*min-release-age[[:space:]]*=' .npmrc || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=.npmrc::expected exactly one min-release-age line, found ${count}"
            exit 1
          fi
          age="$(sed -nE 's/^[[:space:]]*min-release-age[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' .npmrc)"
          if [ -z "$age" ]; then
            echo "::error file=.npmrc::min-release-age is not a whole number of days"
            exit 1
          fi
          # The header value may be quoted, carry a trailing comment, or end in CR.
          npm_block="$(awk '/^[[:space:]]*-[[:space:]]*package-ecosystem:/ { v = $0; sub(/^[^:]*:/, "", v); sub(/#.*/, "", v); gsub(/[^A-Za-z0-9_-]/, "", v); in_npm = (v == "npm") } in_npm' .github/dependabot.yml)"
          if [ -z "$npm_block" ]; then
            echo "::error file=.github/dependabot.yml::no package-ecosystem: npm entry found"
            exit 1
          fi
          for key in default-days semver-patch-days semver-minor-days semver-major-days; do
            n="$(printf '%s\n' "$npm_block" | grep -cE "^[[:space:]]*${key}:" || true)"
            value="$(printf '%s\n' "$npm_block" | sed -nE "s/^[[:space:]]*${key}:[[:space:]]*([0-9]+)[[:space:]]*(#.*)?$/\1/p")"
            if [ "$n" -ne 1 ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key}: expected exactly one, found ${n}"
              status=1
            elif [ "$value" != "$age" ]; then
              echo "::error file=.github/dependabot.yml::npm cooldown ${key} is '${value}', .npmrc min-release-age is ${age}"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "Every npm cooldown window equals min-release-age=${age}."
          fi
          exit "$status"
      # !cancelled() lets setup-node and install run after a release age failure (ADR 0009: one run reports all).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup-node
        if: ${{ !cancelled() }}
        with:
          node-version-file: package.json
      - name: install
        id: install
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm ci
      # Every check below runs even when an earlier one failed, so one run reports them all.
      - name: format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: audit signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm audit signatures
      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run lint
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.typecheck == 'true' }}
        run: npm run typecheck
      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm test
      - name: test:convex
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run test:convex
      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.app == 'true' }}
        run: npm run build
      # Checksum-verified binary, no action (ADR 0009). Version and hash are bumped by hand.
      - name: actionlint
        if: ${{ !cancelled() && steps.scope.outputs.checks == 'true' }}
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      # e2e (#13, ADR 0005): only when every check above passed and the PR changes app code.
      # Headless shell only (the Playwright config sets no channel); no browser cache.
      - name: e2e browsers
        if: ${{ success() && steps.scope.outputs.app == 'true' }}
        run: |
          npx playwright install --with-deps --only-shell chromium
          if [ "$E2E_WEBKIT" = "1" ]; then
            npx playwright install --with-deps webkit
          fi
      # After e2e browsers so scripts/build-icons.test.mjs re-renders the icons in Chromium instead of
      # skipping (#116). !cancelled(), not success(): it still reports its own failures when an earlier
      # check failed (no Chromium is installed then, and that re-render check skips as before), and a
      # failure here skips the e2e steps below, as before.
      - name: test:scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.checks == 'true' }}
        run: npm run test:scripts
      # Anonymous local Convex backend, no secrets (ADR 0005, #59): `convex dev --once` downloads the
      # pinned backend (e2e/support/convex-backend.json), pushes the functions, and runs codegen.
      - name: e2e backend
        id: e2e-backend
        if: ${{ success() && steps.scope.outputs.app == 'true' }}
        run: node scripts/e2e-convex.mjs push
      # Codegen drift (ADR 0009): committed convex/_generated must match what codegen just wrote:
      # no changed tracked file and no new untracked file.
      - name: convex codegen drift
        if: ${{ !cancelled() && steps.e2e-backend.outcome == 'success' }}
        run: |
          drift=0
          git diff --exit-code convex/_generated || drift=1
          untracked="$(git status --porcelain --untracked-files=all -- convex/_generated)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::codegen wrote files that are not committed under convex/_generated"
            drift=1
          fi
          exit "$drift"
      # Push again, development build with CONVEX_URL=http://127.0.0.1:3210, then the specs against
      # the local backend and `npm run serve:ssr` (scripts/e2e.mjs). Runs after a drift failure
      # too, so one run reports both. Only an `affected` selection narrows the run, to those spec
      # filters; an empty, missing, or any other value runs every spec.
      - name: e2e
        id: e2e
        if: ${{ !cancelled() && steps.e2e-backend.outcome == 'success' }}
        env:
          E2E_SCOPE: ${{ steps.specs.outputs.e2e_scope }}
          E2E_SPECS: ${{ steps.specs.outputs.e2e_specs }}
        run: |
          specs=()
          if [ "$E2E_SCOPE" = "affected" ]; then
            read -r -a specs <<< "$E2E_SPECS"
          fi
          echo "e2e: ${#specs[@]} spec filter(s); none means every spec"
          npm run e2e -- "${specs[@]}"
      # The nightly run lists its failing tests for the issue (job `nightly-issue`); the Playwright
      # config writes the JSON report. Always exits 0.
      - name: e2e failures
        id: failures
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.e2e.outcome == 'failure' }}
        run: node scripts/e2e-failures.mjs >> "$GITHUB_OUTPUT"
      - name: e2e report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # The nightly run's failure report (#186): one open `type:bug` issue, commented on again by each
  # failing night. GITHUB_TOKEN with issues: write for this job only; no checkout, no other secret.
  nightly-issue:
    name: nightly-issue
    needs: ci
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILURES: ${{ needs.ci.outputs.e2e_failures }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT: ${{ github.sha }}
      ISSUE_TITLE: Nightly e2e failed on main
    steps:
      - name: open or update the issue
        run: |
          failures="$(printf '%s' "${FAILURES:-[]}" | jq -c 'if type == "array" then . else [] end' 2>/dev/null)" || failures='[]'
          [ -n "$failures" ] || failures='[]'
          body="$(jq -rn --arg run "$RUN_URL" --arg commit "${COMMIT:0:7}" --argjson failures "$failures" '
            "Nightly e2e: FAIL (main \($commit))\n\nRun: \($run)\n\n"
            + (if ($failures | length) > 0
               then "Failing tests:\n" + ($failures | map("- " + .) | join("\n"))
               else "No failing test was recorded: a step before or after the e2e step failed. See the run." end)')"
          number="$(gh issue list --state open --label type:bug --limit 100 --json number,title \
            | jq -r --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label type:bug --body "$body"
          fi

  warm-cache:
    name: warm-cache
    # Runs on main only when the lockfile or this workflow changes, so that PR
    # runs restore main's npm cache (a PR run cannot restore another PR's cache).
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: install (fills the npm cache that setup-node saves)
        run: npm ci --ignore-scripts
